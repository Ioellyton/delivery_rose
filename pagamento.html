<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Confirmação do Pedido</h1>
    </header>

    <div id="pagamento">
        <h2>Resumo do Pedido</h2>

        <!-- Resumo dos itens -->
        <div id="resumo-pedido">
            <!-- Itens do carrinho são inseridos aqui via JavaScript -->
        </div>

        <!-- QR Code do PIX -->
        <div id="qr-code-container">
            <img src="qrcode-pix-exemplo.png" alt="QR Code PIX" class="qr-code">
        </div>

        <!-- Opção de pagamento no local -->
        <button class="btn-pagar" id="btn-pagar-local">Pagar no local</button>

        <!-- Botão de finalizar pagamento -->
        <button class="btn-pagar" id="btn-confirmar-pagamento">Confirmar Pedido</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Carregar os dados do pedido do localStorage e mostrar
        const pedido = JSON.parse(localStorage.getItem('carrinho'));
        const resumoPedido = document.getElementById('resumo-pedido');

        if (pedido && pedido.length > 0) {
            pedido.forEach(item => {
                const divItem = document.createElement('div');
                divItem.classList.add('item-pedido');
                divItem.innerHTML = `
                    <p>${item.nome} - R$ ${item.preco}</p>
                    <p>Quantidade: ${item.quantidade}</p>
                `;
                resumoPedido.appendChild(divItem);
            });

            const total = pedido.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            const totalDiv = document.createElement('div');
            totalDiv.classList.add('total');
            totalDiv.innerHTML = `<h3>Total: R$ ${total.toFixed(2)}</h3>`;
            resumoPedido.appendChild(totalDiv);
        }

        // Funcionalidade de "Pagar no local"
        document.getElementById('btn-pagar-local').addEventListener('click', () => {
            alert('Você escolheu pagar no local! Agradecemos seu pedido.');
            localStorage.removeItem('carrinho');
            window.location.href = 'index.html'; // Redireciona de volta para a página inicial
        });

        // Funcionalidade de "Confirmar Pedido" (aqui você pode adicionar a integração com a API de pagamento)
        document.getElementById('btn-confirmar-pagamento').addEventListener('click', () => {
            alert('Pagamento confirmado! Obrigado pelo seu pedido.');
            localStorage.removeItem('carrinho');
            window.location.href = 'index.html'; // Redireciona para a página inicial
        });
    </script>
</body>
</html>
