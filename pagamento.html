<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento - Delivery Rápido</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="script.js"></script>
</head>

<body>
  <header>
    <h1>Delivery Rápido</h1>
    <nav>
      <ul>
        <li><a href="index.html">Cardápio</a></li>
        <li><a href="carrinho.html">Carrinho</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="finalizar-pedido">
      <h2>Finalize seu Pedido</h2>

      <!-- Formulário para finalizar a compra -->
      <form id="form-pedido" onsubmit="finalizarCompra(event)">
        <div class="campo-formulario">
          <label for="endereco">Endereço de Entrega</label>
          <input type="text" id="endereco" name="endereco" required placeholder="Digite seu endereço">
        </div>

        <div class="campo-formulario">
          <label for="forma-pagamento">Forma de Pagamento</label>
          <select id="forma-pagamento" name="forma-pagamento" required>
            <option value="pix">PIX</option>
            <option value="no-local">No local</option>
          </select>
        </div>

        <button type="submit" class="btn-add">Finalizar Compra</button>
      </form>
    </section>

    <!-- Resumo do pedido -->
    <section id="resumo-pedido">
      <h2>Resumo do Pedido</h2>
      <!-- Itens do pedido serão carregados aqui dinamicamente -->
    </section>

    <!-- Total do pedido -->
    <div id="total-pedido">
      <!-- Total será calculado e exibido aqui -->
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Delivery Rápido. Todos os direitos reservados.</p>
  </footer>

  <script>
    // Função para finalizar a compra
    function finalizarCompra(event) {
      event.preventDefault();

      // Obtém os valores do formulário
      const endereco = document.getElementById('endereco').value;
      const formaPagamento = document.getElementById('forma-pagamento').value;

      // Verifica se o carrinho está vazio
      const pedido = JSON.parse(localStorage.getItem('carrinho')) || [];
      if (pedido.length === 0) {
        alert('Seu carrinho está vazio.');
        return;
      }

      // Mostra o resumo do pedido
      const resumoPedido = document.getElementById('resumo-pedido');
      resumoPedido.innerHTML = '<h3>Resumo do Pedido:</h3>';
      pedido.forEach(item => {
        const divItem = document.createElement('div');
        divItem.classList.add('item-pedido');
        divItem.innerHTML = `
          <p>${item.nome} - R$ ${item.preco.toFixed(2)}</p>
          <p>Quantidade: ${item.quantidade}</p>
          <p>Subtotal: R$ ${(item.preco * item.quantidade).toFixed(2)}</p>
        `;
        resumoPedido.appendChild(divItem);
      });

      // Calcula o total do pedido
      const total = pedido.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
      const totalPedido = document.getElementById('total-pedido');
      totalPedido.innerHTML = `<h3>Total: R$ ${total.toFixed(2)}</h3>`;

      // Exibe mensagem de sucesso
      alert(`Pedido realizado com sucesso!\nEndereço: ${endereco}\nForma de pagamento: ${formaPagamento}`);

      // Limpa o carrinho
      localStorage.removeItem('carrinho');

      // Redireciona para a página inicial após o pedido
      window.location.href = 'index.html';
    }

    // Carregar dados do carrinho no carregamento da página
    window.onload = function () {
      const pedido = JSON.parse(localStorage.getItem('carrinho')) || [];
      if (pedido.length === 0) {
        document.getElementById('resumo-pedido').innerHTML = '<p>Seu carrinho está vazio.</p>';
      }
    }
  </script>
</body>
</html>
